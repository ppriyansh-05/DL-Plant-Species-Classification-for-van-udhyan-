<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="deepLeaf" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="60%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#081C15" />
    </linearGradient>

    <linearGradient id="emeraldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="50%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#133626" />
    </linearGradient>

    <linearGradient id="oliveGoldLeaf" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="40%" stop-color="#B7C56A" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>

    <linearGradient id="sageLeaf" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#7FA38A" />
      <stop offset="60%" stop-color="#40634E" />
      <stop offset="100%" stop-color="#193024" />
    </linearGradient>

    <linearGradient id="terracottaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E" />
      <stop offset="60%" stop-color="#8B5E3C" />
      <stop offset="100%" stop-color="#4A2810" />
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Glow Behind Leaves -->
  <circle cx="360" cy="320" r="180" fill="#52B788" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="440" cy="220" r="140" fill="#C9A227" opacity="0.06" filter="url(#glowFilter)" />

  <!-- Layer 1: Background Deep Forest Leaves -->
  <g filter="url(#shadowFilter)">
    <!-- Big Monstery / Broad Leaf -->
    <path d="M460 620 C480 440 560 300 480 140 C420 180 370 280 390 440 C400 520 440 580 460 620 Z" fill="url(#deepLeaf)" opacity="0.85" />
    <path d="M480 140 C465 240 445 420 460 620" stroke="#52B788" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Side ribs -->
    <path d="M472 220 C440 230 400 245 378 270" stroke="#52B788" stroke-width="1.2" stroke-opacity="0.3" />
    <path d="M466 310 C430 325 390 350 384 380" stroke="#52B788" stroke-width="1.2" stroke-opacity="0.3" />
    <path d="M462 400 C435 415 405 440 400 470" stroke="#52B788" stroke-width="1.2" stroke-opacity="0.3" />
  </g>

  <!-- Layer 2: Sage Oval Leaf (Left tilt) -->
  <g filter="url(#shadowFilter)">
    <path d="M220 540 C190 400 220 260 340 180 C360 270 340 420 280 500 C250 530 230 540 220 540 Z" fill="url(#sageLeaf)" />
    <path d="M340 180 C290 280 250 420 220 540" stroke="#B7C56A" stroke-width="2" stroke-opacity="0.5" />
    <path d="M320 225 C280 240 250 270 240 300" stroke="#B7C56A" stroke-width="1.2" stroke-opacity="0.35" />
    <path d="M295 285 C260 305 235 340 230 370" stroke="#B7C56A" stroke-width="1.2" stroke-opacity="0.35" />
    <path d="M270 350 C245 370 225 410 225 440" stroke="#B7C56A" stroke-width="1.2" stroke-opacity="0.35" />
  </g>

  <!-- Layer 3: Main Vibrant Leaf (Center / Top Hero leaf) -->
  <g filter="url(#shadowFilter)">
    <!-- Classic Cordate / Sacred Fig / Ficus Leaf with Elegant Drip Tip -->
    <path d="M420 480 C520 420 550 250 480 90 C450 60 410 50 380 90 C330 180 310 320 370 440 C390 470 410 480 420 480 Z" fill="url(#emeraldLeaf)" />
    <path d="M410 75 C420 180 410 350 420 480" stroke="#B7C56A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Detailed ribs -->
    <path d="M412 130 C440 120 470 125 490 145" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M412 130 C380 135 355 155 345 180" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M414 195 C450 185 490 195 515 220" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M414 195 C375 205 340 230 330 260" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M416 270 C455 260 500 275 520 310" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M416 270 C380 280 345 315 340 345" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M418 350 C450 345 490 365 505 400" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M418 350 C385 365 360 400 360 430" stroke="#B7C56A" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Layer 4: Warm Golden/Olive Foreground Leaf -->
  <g filter="url(#shadowFilter)">
    <path d="M540 520 C570 380 520 220 460 160 C420 210 410 320 440 420 C465 490 510 520 540 520 Z" fill="url(#oliveGoldLeaf)" opacity="0.95" />
    <path d="M460 160 C465 260 475 390 540 520" stroke="#F4E087" stroke-width="2" stroke-opacity="0.7" />
    <path d="M465 210 C490 205 520 215 535 235" stroke="#F4E087" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M470 270 C500 265 530 280 545 305" stroke="#F4E087" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M478 335 C510 335 535 355 545 385" stroke="#F4E087" stroke-width="1.2" stroke-opacity="0.5" />
  </g>

  <!-- Layer 5: Small Autumnal Terracotta Seed Capsule / Bud Leaf Accent -->
  <g filter="url(#shadowFilter)">
    <path d="M300 460 C260 380 250 310 280 270 C310 290 320 350 315 420 C310 450 305 460 300 460 Z" fill="url(#terracottaAccent)" opacity="0.9" />
    <path d="M280 270 C285 330 295 400 300 460" stroke="#E9D8A6" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M284 310 C298 315 310 330 312 345" stroke="#E9D8A6" stroke-width="1" stroke-opacity="0.4" />
    <path d="M288 355 C302 360 312 380 314 395" stroke="#E9D8A6" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Delicate Dewdrop Accents with Specular Highlights -->
  <ellipse cx="440" cy="240" rx="8" ry="6" fill="#FFFFFF" fill-opacity="0.25" />
  <circle cx="438" cy="238" r="2.5" fill="#FFFFFF" fill-opacity="0.8" />
  
  <ellipse cx="370" cy="290" rx="6" ry="5" fill="#FFFFFF" fill-opacity="0.2" />
  <circle cx="368" cy="288" r="2" fill="#FFFFFF" fill-opacity="0.75" />
</svg>
