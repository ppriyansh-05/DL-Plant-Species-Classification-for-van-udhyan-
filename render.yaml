services:
  # ==============================================================================
  # 1. FastAPI Neural Inference Web Service
  # ==============================================================================
  - type: web
    name: van-udyan-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: models
      - key: SUPABASE_MODEL_PATH
        value: best_van_udyan_top15.keras
      - key: CORS_ORIGINS
        value: "*"

  # ==============================================================================
  # 2. React + Vite Dark-Bento Frontend Static Site
  # ==============================================================================
  - type: static
    name: van-udyan-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    publishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://van-udyan-backend.onrender.com
